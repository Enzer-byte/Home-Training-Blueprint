    <script>
      // Compatibility shim: ensure window.fetch has both getter and setter
      // Prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when preview proxies, analytics, or polyfills assign to window.fetch
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var proto = (typeof Window !== 'undefined' && Window.prototype) || Object.getPrototypeOf(window);
            var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
            var currentFetch = nativeFetch;

            var descriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            };

            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e) {}

            if (proto && proto !== window) {
              try {
                Object.defineProperty(proto, 'fetch', descriptor);
              } catch (e) {}
            }
          }
        } catch (err) {}
      })();
    </script>
